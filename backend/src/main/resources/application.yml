server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: corpedia-backend

  # 统一接口路径前缀 /api
  mvc:
    servlet:
      path: /api

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/corpedia?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ==== Spring AI 2.0: LM Studio(OpenAI 兼容) ====
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      base-url: ${AI_BASE_URL:http://localhost:1234/v1}
      api-key: ${AI_API_KEY:lm-studio}
      chat:
        model: ${CHAT_MODEL:google/gemma-4-e4b}
        options:
          temperature: 0.2
      embedding:
        model: ${EMBEDDING_MODEL:text-embedding-bge-m3}
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          databaseName: default
        initialize-schema: true
        embedding-dimension: ${EMBEDDING_DIMENSION:1024}
        collection-name: ${MILVUS_COLLECTION:corpedia_chunks}

# 业务自定义配置
corpedia:
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: 86400          # 24h
  storage:
    path: ./storage/documents      # 上传文件落盘目录（相对 backend/ 运行目录）
  seed:
    enabled: ${SEED_ENABLED:false}
    password: ${SEED_PASSWORD:}
  rag:
    chunk-size: 500
    chunk-overlap: 100
    top-k: 10
    rerank-top: 3
    similarity-threshold: 0.5   # 更换模型或语料后，使用测试问题集重新校准
    collection: ${MILVUS_COLLECTION:corpedia_chunks}
    history-messages: 6         # 阶段4: 多轮历史拼入 Prompt 的消息条数
  # AI 工具（Function Calling）配置
  amap:
    api-key: ${AMAP_API_KEY:9f81290f67a03d2920afdd29bfaf72c9}   # 高德开放平台 Web 服务 Key，用于天气等查询工具

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.corpedia: info

# ==== Knife4j / springdoc-openapi (Boot4) ====
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

knife4j:
  enable: true
  setting:
    language: zh_cn
